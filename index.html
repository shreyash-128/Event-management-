<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSI TechFest 2026 Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div class="wrapper">
    <div class="panel">
      <div class="panel-content">
        <h2>CSI TechFest <span>2026</span></h2>
        <p>One event. Four categories. Countless ideas waiting to happen.</p>
 
        <div class="tags">
          <span>Coding</span>
          <span>Web Design</span>
          <span>Robotics</span>
          <span>Quiz</span>
        </div>
 
        <div class="details">
          <p>📍 Venue: DMCE Auditorium</p>
          <p>📅 Date: 15 August 2026</p>
          <p>⏰ Time: 10:00 AM</p>
        </div>
      </div>
    </div>
 
    <div class="form-side">
      <div class="card">
        <h1>Register Now</h1>
        <p class="sub">Fill in your details to secure a spot</p>
 
        <form>
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" required>
 
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
 
          <label for="college">College Name</label>
          <input type="text" id="college" placeholder="Enter your college" required>
 
          <label for="event">Select Event</label>
          <select id="event">
            <option>Coding Contest</option>
            <option>Web Design</option>
            <option>Robotics</option>
            <option>Quiz</option>
          </select>
 
          <button type="submit">Register</button>
        </form>
 
        <p class="footer">© 2026 CSI TechFest. All rights reserved.</p>
      </div>
    </div>
 
  </div>
</body>
</html>
